# Internal only (ClusterIP): reachable inside the cluster as http://product-service:3002
apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app: product-service
    app.kubernetes.io/part-of: campusconnect
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - port: 3002
      targetPort: 3002
