# Grafana with the Prometheus data source and the "Lab 8 - CampusConnect" dashboard
# provisioned from ConfigMaps. Anonymous users get read-only (Viewer) access;
# log in as admin (Grafana's default, changed on first login) to edit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: lab8
        folder: Lab 8
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  lab8.json: |
    {
      "uid": "lab8",
      "title": "Lab 8 - CampusConnect",
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "schemaVersion": 39,
      "panels": [
        {
          "type": "stat", "title": "Are targets reachable? (pods UP per service)",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (service) (up{job=\"campusconnect\"})", "legendFormat": "{{service}}" }],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [
            { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } } }
        },
        {
          "type": "timeseries", "title": "How much traffic is arriving? (gateway req/s by target)",
          "gridPos": { "x": 0, "y": 5, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (target) (rate(http_requests_total{service=\"api-gateway\"}[1m]))", "legendFormat": "{{target}}" }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "type": "timeseries", "title": "Are failures increasing? (gateway 4xx/5xx req/s)",
          "gridPos": { "x": 12, "y": 5, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (target, status) (rate(http_requests_total{service=\"api-gateway\", status=~\"4..|5..\"}[1m]))", "legendFormat": "{{target}} {{status}}" }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "type": "timeseries", "title": "How long are requests taking? (gateway p95 latency)",
          "gridPos": { "x": 0, "y": 13, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le, target) (rate(http_request_duration_seconds_bucket{service=\"api-gateway\"}[1m])))", "legendFormat": "{{target}}" }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries", "title": "Is User Service load spread across replicas? (req/s per pod)",
          "gridPos": { "x": 12, "y": 13, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (pod) (rate(http_requests_total{service=\"user-service\"}[1m]))", "legendFormat": "{{pod}}" }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports:
            - containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/lab8.json
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
