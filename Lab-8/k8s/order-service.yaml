# Internal only (ClusterIP): reachable inside the cluster as http://order-service:3003
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
    app.kubernetes.io/part-of: campusconnect
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 3003
      targetPort: 3003
