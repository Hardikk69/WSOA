# Local Kubernetes cluster for Lab 8 (kind = Kubernetes in Docker).
# Maps NodePort 30080 (gateway) to localhost:30080 so Postman can reach it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab8
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
