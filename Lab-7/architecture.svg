<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="960" height="680" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">CampusConnect – Lab 7: API Gateway, Service Discovery &amp; Cloud</text>

  <!-- Client -->
  <rect x="350" y="52" width="260" height="52" rx="8" fill="#f1f5f9" stroke="#334155"/>
  <text x="480" y="76" text-anchor="middle" font-weight="600">Client / Postman</text>
  <text x="480" y="94" text-anchor="middle" font-size="12" fill="#475569">one address: {{gateway}}</text>
  <line x1="480" y1="104" x2="480" y2="146" stroke="#334155" marker-end="url(#a)"/>
  <text x="490" y="130" font-size="12" fill="#334155">localhost:8000 · https://campusconnect-gateway.onrender.com</text>

  <!-- Gateway -->
  <rect x="330" y="148" width="300" height="92" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="480" y="174" text-anchor="middle" font-weight="700" font-size="16">api-gateway (public)</text>
  <text x="480" y="194" text-anchor="middle" font-size="12">Express + http-proxy-middleware · :8000</text>
  <text x="480" y="212" text-anchor="middle" font-size="12" fill="#334155">GET /health · request logging</text>
  <text x="480" y="229" text-anchor="middle" font-size="12" fill="#334155">503 unreachable / 502 bad upstream · 404 no route</text>

  <!-- Service registry -->
  <rect x="690" y="156" width="245" height="76" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-dasharray="6 4"/>
  <text x="812" y="178" text-anchor="middle" font-weight="700" fill="#6d28d9">Service Registry (config)</text>
  <text x="812" y="197" text-anchor="middle" font-size="11" fill="#475569">.env locally · env vars on Render</text>
  <text x="812" y="214" text-anchor="middle" font-size="11" fill="#475569">USER_ / PRODUCT_ / ORDER_SERVICE_URL</text>
  <line x1="688" y1="194" x2="634" y2="194" stroke="#7c3aed" stroke-dasharray="5 3" marker-end="url(#p)"/>
  <text x="661" y="186" text-anchor="middle" font-size="10" fill="#7c3aed">startup</text>

  <!-- Docker network boundary -->
  <rect x="30" y="268" width="900" height="232" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="10 5"/>
  <text x="50" y="292" font-weight="700" fill="#1d4ed8">Docker network: campus-network</text>
  <text x="910" y="292" text-anchor="end" font-size="12" fill="#1d4ed8">no host ports – reachable only through the gateway</text>

  <!-- Gateway -> services -->
  <line x1="400" y1="240" x2="200" y2="318" stroke="#334155" marker-end="url(#a)"/>
  <text x="262" y="262" font-size="12" font-weight="600" fill="#334155">/users/*</text>
  <line x1="480" y1="240" x2="480" y2="318" stroke="#334155" marker-end="url(#a)"/>
  <text x="488" y="312" font-size="12" font-weight="600" fill="#334155">/products/*</text>
  <line x1="560" y1="240" x2="760" y2="318" stroke="#334155" marker-end="url(#a)"/>
  <text x="640" y="262" font-size="12" font-weight="600" fill="#334155">/orders/*</text>

  <!-- Services -->
  <rect x="70" y="320" width="220" height="100" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="180" y="348" text-anchor="middle" font-weight="700" font-size="16">user-service</text>
  <text x="180" y="368" text-anchor="middle" font-size="12">Express · :3001</text>
  <text x="180" y="390" text-anchor="middle" font-size="12" fill="#334155">GET/POST /users</text>
  <text x="180" y="407" text-anchor="middle" font-size="12" fill="#334155">GET/PUT/DELETE /users/{id}</text>

  <rect x="370" y="320" width="220" height="100" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="480" y="348" text-anchor="middle" font-weight="700" font-size="16">product-service</text>
  <text x="480" y="368" text-anchor="middle" font-size="12">Express · :3002</text>
  <text x="480" y="390" text-anchor="middle" font-size="12" fill="#334155">GET/POST /products</text>
  <text x="480" y="407" text-anchor="middle" font-size="12" fill="#334155">GET/PUT/DELETE /products/{id}</text>

  <rect x="670" y="320" width="220" height="100" rx="10" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/>
  <text x="780" y="348" text-anchor="middle" font-weight="700" font-size="16">order-service</text>
  <text x="780" y="368" text-anchor="middle" font-size="12">Express · :3003</text>
  <text x="780" y="390" text-anchor="middle" font-size="12" fill="#334155">POST /orders · GET /orders</text>
  <text x="780" y="407" text-anchor="middle" font-size="12" fill="#334155">GET /orders/{id}</text>

  <!-- Order -> User / Product -->
  <line x1="668" y1="360" x2="594" y2="360" stroke="#c2410c" stroke-width="2" marker-end="url(#r)"/>
  <path d="M720,420 C660,488 320,488 250,422" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#r)"/>
  <rect x="560" y="462" width="150" height="18" fill="#eff6ff"/>
  <text x="635" y="475" text-anchor="middle" font-size="12" fill="#c2410c" font-weight="600">GET /users/{id}</text>
  <text x="631" y="338" text-anchor="middle" font-size="11" fill="#c2410c" font-weight="600">GET</text>
  <text x="631" y="352" text-anchor="middle" font-size="11" fill="#c2410c" font-weight="600">/products/{id}</text>

  <!-- MongoDB Atlas -->
  <rect x="40" y="530" width="880" height="130" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="60" y="552" font-weight="700" fill="#15803d">MongoDB Atlas (cloud)</text>
  <text x="900" y="552" text-anchor="end" font-size="12" fill="#15803d">one database per service · MONGO_URI from config</text>
  <line x1="180" y1="420" x2="180" y2="574" stroke="#334155" marker-end="url(#a)"/>
  <line x1="480" y1="420" x2="480" y2="574" stroke="#334155" marker-end="url(#a)"/>
  <line x1="780" y1="420" x2="780" y2="574" stroke="#334155" marker-end="url(#a)"/>
  <g font-size="12">
    <ellipse cx="180" cy="586" rx="80" ry="10" fill="#dcfce7" stroke="#15803d"/>
    <path d="M100,586 V630 A80,10 0 0 0 260,630 V586" fill="#dcfce7" stroke="#15803d"/>
    <text x="180" y="614" text-anchor="middle" font-weight="700">userdb</text>
    <ellipse cx="480" cy="586" rx="80" ry="10" fill="#dcfce7" stroke="#15803d"/>
    <path d="M400,586 V630 A80,10 0 0 0 560,630 V586" fill="#dcfce7" stroke="#15803d"/>
    <text x="480" y="614" text-anchor="middle" font-weight="700">productdb</text>
    <ellipse cx="780" cy="586" rx="80" ry="10" fill="#dcfce7" stroke="#15803d"/>
    <path d="M700,586 V630 A80,10 0 0 0 860,630 V586" fill="#dcfce7" stroke="#15803d"/>
    <text x="780" y="614" text-anchor="middle" font-weight="700">orderdb</text>
  </g>
  <text x="480" y="674" text-anchor="middle" font-size="11" fill="#64748b">Local Compose run uses mongo:7 containers (user-db / product-db / order-db) on campus-network by default; set *_MONGO_URI in .env to use Atlas.</text>
</svg>
